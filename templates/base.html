{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ profile.full_name }} — Portfolio & Systems Architecture{% endblock %}</title>
    
    <meta name="description" content="{{ profile.headline }} — {{ profile.university }}">
    <meta name="author" content="{{ profile.full_name }}">
    <meta name="theme-color" content="#090a0f">

    <!-- Fonts: Plus Jakarta Sans, Instrument Serif & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              canvas: {
                DEFAULT: '#090a0f',
                surface: '#11131c',
                elevated: '#161925',
              },
              accent: {
                indigo: '#4f46e5',
                blue: '#3b82f6',
                emerald: '#10b981',
                coral: '#e05a33',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              serif: ['Instrument Serif', 'Georgia', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- Studio Architectural Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="w-full min-h-screen overflow-x-hidden bg-[#090a0f] text-[#f3f4f6] antialiased selection:bg-indigo-600 selection:text-white flex flex-col transition-colors duration-300">

    {% csrf_token %}

    {% block content %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}

</body>
</html>
