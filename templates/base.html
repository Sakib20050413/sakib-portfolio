{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ profile.full_name }} — Portfolio{% endblock %}</title>
    
    <meta name="description" content="{{ profile.headline }} — {{ profile.university }}">
    <meta name="author" content="{{ profile.full_name }}">
    <meta name="theme-color" content="#0c0d12">

    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: {
                950: '#0c0d12',
                900: '#13151c',
                850: '#181b24',
                800: '#202430',
              },
              accent: {
                indigo: '#4f46e5',
                blue: '#3b82f6',
                emerald: '#10b981',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- Refined Editorial Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#0c0d12] text-[#f4f4f6] antialiased selection:bg-indigo-600 selection:text-white min-h-screen flex flex-col">

    {% csrf_token %}

    {% block content %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}

</body>
</html>
