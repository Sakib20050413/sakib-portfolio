{% extends 'dashboard/base_dashboard.html' %}

{% block dashboard_content %}
<div class="max-w-4xl space-y-8">

    <!-- Header -->
    <div class="border-b border-neutral-800 pb-4">
        <span class="text-xs font-mono text-neutral-400 uppercase tracking-wider">Configuration</span>
        <h1 class="text-2xl sm:text-3xl font-bold text-white mt-1">Profile & Social Links</h1>
        <p class="text-xs text-neutral-400 mt-1">Updates live hero text, contact information, and curriculum vitae.</p>
    </div>

    <form method="POST" action="{% url 'dashboard:profile_manager' %}" class="space-y-6 text-xs font-mono">
        {% csrf_token %}

        <!-- Basic Info Box -->
        <div class="surface-card p-6 sm:p-8 space-y-4">
            <h2 class="text-xs font-mono font-semibold text-neutral-300 uppercase tracking-wider">
                1. Core Personal Details
            </h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-neutral-400 mb-1">FULL NAME</label>
                    <input type="text" name="full_name" value="{{ profile.full_name }}" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600 font-sans">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">DISPLAY HANDLE</label>
                    <input type="text" name="display_handle" value="{{ profile.display_handle }}" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-neutral-400 mb-1">STUDENT ID (BAIUST)</label>
                    <input type="text" name="student_id" value="{{ profile.student_id }}" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">LOCATION</label>
                    <input type="text" name="location" value="{{ profile.location }}" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600 font-sans">
                </div>
            </div>

            <div>
                <label class="block text-neutral-400 mb-1">HEADLINE</label>
                <input type="text" name="headline" value="{{ profile.headline }}" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600 font-sans">
            </div>

            <div>
                <label class="block text-neutral-400 mb-1">HUMAN-CRAFTED BIO</label>
                <textarea name="bio" rows="4" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600 leading-relaxed font-sans">{{ profile.bio }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-neutral-400 mb-1">PRIMARY EMAIL</label>
                    <input type="email" name="primary_email" value="{{ profile.primary_email }}" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">AVAILABILITY STATUS</label>
                    <input type="text" name="availability_status" value="{{ profile.availability_status }}" required class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600 font-sans">
                </div>
            </div>
        </div>

        <!-- Social Profiles Box -->
        <div class="surface-card p-6 sm:p-8 space-y-4">
            <h2 class="text-xs font-mono font-semibold text-neutral-300 uppercase tracking-wider">
                2. Professional & Developer Profile Links
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-neutral-400 mb-1">GITHUB URL</label>
                    <input type="url" name="github_url" value="{{ profile.github_url }}" class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">LINKEDIN URL</label>
                    <input type="url" name="linkedin_url" value="{{ profile.linkedin_url }}" class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">X (TWITTER) URL</label>
                    <input type="url" name="x_twitter_url" value="{{ profile.x_twitter_url }}" class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">LEETCODE PROFILE URL</label>
                    <input type="url" name="leetcode_url" value="{{ profile.leetcode_url }}" class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">KAGGLE PROFILE URL</label>
                    <input type="url" name="kaggle_url" value="{{ profile.kaggle_url }}" class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
                <div>
                    <label class="block text-neutral-400 mb-1">FACEBOOK URL</label>
                    <input type="url" name="facebook_url" value="{{ profile.facebook_url }}" class="w-full px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-white focus:outline-none focus:border-neutral-600">
                </div>
            </div>
        </div>

        <div class="flex justify-end pt-2">
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-white text-black font-semibold hover:bg-neutral-200 transition shadow-sm font-sans text-sm">
                Save Profile Settings
            </button>
        </div>
    </form>

</div>
{% endblock %}
