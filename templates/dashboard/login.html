<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login (/dashboard/) — {{ profile.full_name }}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-[#07080d] text-white flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-[#10131e] border border-white/10 rounded-2xl p-8 space-y-6">
    <div>
      <span class="text-xs font-mono text-indigo-400 uppercase">[ DIRECT-URL ADMIN CMS ]</span>
      <h1 class="text-2xl font-bold mt-1">Sign in to Portfolio Controller</h1>
    </div>
    {% if error %}
    <div class="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-xs font-mono text-rose-300">{{ error }}</div>
    {% endif %}
    <form method="POST" class="space-y-4 text-xs">
      {% csrf_token %}
      <div>
        <label class="block font-mono text-gray-400 mb-1">Username</label>
        <input type="text" name="username" value="sakib_admin" required class="w-full bg-[#080a10] border border-white/15 rounded-xl px-3.5 py-2.5 text-white" />
      </div>
      <div>
        <label class="block font-mono text-gray-400 mb-1">Password</label>
        <input type="password" name="password" placeholder="baiust1119003" required class="w-full bg-[#080a10] border border-white/15 rounded-xl px-3.5 py-2.5 text-white" />
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-mono font-bold">Unlock /dashboard/ →</button>
    </form>
  </div>
</body>
</html>
