services:
  - type: web
    name: sakib-portfolio
    env: python
    region: singapore
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn portfolio_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ADMIN_URL
        value: studio-7f3k/
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
